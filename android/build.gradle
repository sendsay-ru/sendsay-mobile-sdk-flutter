import org.jetbrains.kotlin.gradle.dsl.JvmTarget

group 'com.sendsay'
version '2.1.0-SNAPSHOT'

buildscript {
    ext {
        kotlinVersion = '2.2.20'
        agpVersion = '8.13.2'
        kspVersion = '2.0.4'
        gsonVersion = '2.11.0'
        roomVersion = '2.6.1'
        sendsaySdkVersion = '0.1.5'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agpVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:$kotlinVersion-$kspVersion"
        classpath "androidx.room:room-gradle-plugin:$roomVersion"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
//apply plugin: 'com.android.experimental.built-in-kotlin'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'maven-publish'

android {
    namespace 'com.sendsay'
    compileSdk = 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    api "com.sendsay.sdk:sdk:$sendsaySdkVersion"
//    implementation project(':sdk')
//    implementation(files("../sdk"))

    implementation "com.google.code.gson:gson:$gsonVersion"
//    implementation "com.android.tools.build:gradle:$agpVersion"
//    implementation "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    implementation 'androidx.appcompat:appcompat:1.7.0'
}
